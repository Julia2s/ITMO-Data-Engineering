name: hw3-devops

services:
  rustfs-home:
    image: rustfs/rustfs:1.0.0
    container_name: hh-rustfs-home
    networks: [stand]
    restart: "no"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-hhadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-hhadmin-secret}
      RUSTFS_VOLUMES: /data/vol{1...4}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - rustfs-home:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  s3cli:
    image: amazon/aws-cli:2.36.45
    container_name: hh-s3cli
    networks: [stand]
    restart: "no"
    entrypoint: ["sh", "-c", "sleep infinity"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-hhadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-hhadmin-secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      rustfs-home:
        condition: service_healthy

networks:
  stand:

volumes:
  rustfs-home:
